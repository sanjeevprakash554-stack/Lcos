services:
  - type: web
    name: lcos-operations-system
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: USE_EMBEDDED_DB
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: WHATSAPP_ENABLED
        value: "false"
